name: Validate skills portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_repository.py
      - name: Check authored-file whitespace
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- . ':(exclude)active/**' ':(exclude)managed/**'; then
            exit 1
          fi
